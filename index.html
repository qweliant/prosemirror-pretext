<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prosemirror-pretext — demo</title>
    <!--
        There is exactly one demo, and it lives in site/. `bun run dev` now
        serves that directory directly, so this file is not part of the dev
        flow — it is only a signpost for anyone pointing an ordinary static
        server at the repository root, so they land on the demo rather than a
        directory listing.
    -->
    <meta http-equiv="refresh" content="0; url=./site/" />
    <link rel="canonical" href="./site/" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #e7faf0;
            color: #2f6e1c;
            font: 500 15px/1.6 system-ui, sans-serif;
        }

        a {
            color: #46a8d8;
        }
    </style>
</head>

<body>
    <p>Taking you to the demo — <a href="./site/">site/index.html</a>…</p>
    <script type="module">
        // Belt and braces: `<meta refresh>` is disabled in some setups.
        location.replace(new URL('./site/', location.href))
    </script>
</body>

</html>
